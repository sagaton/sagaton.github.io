<style>
html,body{margin:0;height:100%;background:#0b3a63;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;display:flex;gap:10px;align-items:center;pointer-events:none;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.bar{flex:1;max-width:220px;height:14px;border-radius:9px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.9);overflow:hidden}.bar i{display:block;height:100%;background:#ffd34d;border-radius:6px;transition:width .2s}
#clock{font-size:15px;padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.25)}#lv{font-size:15px}
.scr{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;background:rgba(10,58,99,.45);text-align:center;padding:20px}
.scr h1{margin:0;font-size:clamp(40px,10vw,68px);letter-spacing:-.02em;color:#fff;text-shadow:0 4px 0 #2a6fa8,0 0 24px rgba(255,255,255,.4)}
.scr h1 small{display:block;font-size:.3em;letter-spacing:.3em;opacity:.85;margin-top:4px;text-shadow:none}
.scr p{margin:0;color:#e6f5ff;font-size:15px;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.pick{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:4px 4px 8px}
.pick button{flex:none;width:122px;padding:6px 6px 10px;border-radius:20px;border:3px solid #fff;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.pick canvas{width:108px;height:80px;display:block;margin:0 auto 2px}
.pick button.lock{opacity:.5;filter:grayscale(1);cursor:not-allowed}.pick button.sel{background:#ffd34d;color:#3a2200}
.pick small{display:block;font-weight:600;font-size:11.5px;margin-top:2px}
.go{font:inherit;font-weight:900;font-size:20px;padding:14px 40px;border-radius:999px;border:none;background:#ffd34d;color:#3a2200;cursor:pointer;box-shadow:0 5px 0 #c99a1a}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a1a}
.xp{width:min(320px,80vw);height:16px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.xp i{display:block;height:100%;background:#7ef0a8;width:0;transition:width 1s}
.hide{display:none!important}
.panel{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%;padding:12px 12px 10px;border-radius:24px;background:rgba(10,50,90,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.6);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.15)}
#tip{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(0,0,0,.3);padding:6px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.foot{font-size:12px;opacity:.8}.foot a{color:#fff}
@media (max-height:520px){.panel{padding:8px;gap:5px}.pick canvas{height:44px!important}.pick button{width:92px!important;padding:4px 4px 6px!important;font-size:13px}.scr{gap:7px;padding:10px}.scr h1{font-size:36px}.scr p{font-size:13px}.pick canvas{height:58px}.pick button{width:104px}.go{padding:10px 30px;font-size:17px}}

.st{justify-content:space-between!important;background:none!important;padding:calc(18px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))!important}
.st .ttl h1{font-family:'Jua',system-ui,sans-serif;font-weight:400;font-size:clamp(46px,9vw,92px);color:#fff;letter-spacing:.02em;text-shadow:none;-webkit-text-stroke:0;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #3b2a22) drop-shadow(0 0 0 #3b2a22);
 text-shadow:3px 0 0 #3b2a22,-3px 0 0 #3b2a22,0 3px 0 #3b2a22,0 -3px 0 #3b2a22,2px 2px 0 #3b2a22,-2px 2px 0 #3b2a22,2px -2px 0 #3b2a22,-2px -2px 0 #3b2a22}
.st .ser{font-family:'Jua',system-ui,sans-serif;font-size:clamp(15px,2.2vw,20px);color:#3b2a22;background:rgba(255,255,255,.85);border:3px solid #3b2a22;border-radius:999px;display:inline-block;padding:3px 16px;margin-top:6px}
.dock{display:flex;flex-direction:column;align-items:center;gap:10px}
.st .pick{gap:8px;justify-content:center;flex-wrap:wrap;overflow:visible}
.st .pick button{width:auto;min-width:84px;padding:4px 10px 6px;border-radius:18px;border:3px solid #3b2a22;background:rgba(255,255,255,.88);color:#3b2a22;font-family:'Jua',system-ui,sans-serif;font-weight:400;font-size:16px;position:relative;filter:none!important;opacity:1!important;box-shadow:0 3px 0 #3b2a22}
.st .pick button.sel{background:#ffd34d}
.st .pick button.lock{background:rgba(255,255,255,.6);color:#7a6a60}
.st .pick button.lock canvas{opacity:.35}
.st .pick button.lock::after{content:"🔒";position:absolute;right:6px;top:4px;font-size:14px}
.st .pick canvas{width:76px!important;height:52px!important}
.st .pick small{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;opacity:.8}
.st .go{font-family:'Jua',system-ui,sans-serif;font-weight:400;font-size:24px;border:3px solid #3b2a22;box-shadow:0 5px 0 #3b2a22;padding:10px 40px}
.st .go:active{box-shadow:0 2px 0 #3b2a22}
.st .foot{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
@media (max-height:520px){.st .ttl h1{font-size:40px}.st .pick canvas{width:56px!important;height:38px!important}.st .pick button{min-width:66px;font-size:13px}.st .go{font-size:19px;padding:7px 28px}.st .pick small{display:none}}

function shiftRig(R,dx,dy){const P=a=>[a[0]+dx,a[1]+dy];return {...R,tailX:R.tailX+dx,tailPivot:P(R.tailPivot),ell:[R.ell[0]+dx,R.ell[1]+dy,R.ell[2],R.ell[3]],finTop:{r:[R.finTop.r[0]+dx,R.finTop.r[1]+dy,R.finTop.r[2],R.finTop.r[3]],p:P(R.finTop.p)},finBot:{r:[R.finBot.r[0]+dx,R.finBot.r[1]+dy,R.finBot.r[2],R.finBot.r[3]],p:P(R.finBot.p)},eye:P(R.eye),mouth:P(R.mouth),blush:P(R.blush)};}

function mk(w,h){const o=document.createElement('canvas');o.width=w;o.height=h;return o;}
function build(img,R){const w=img.naturalWidth,h=img.naturalHeight,[ex,ey,erx,ery]=R.ell;const part=fn=>{const o=mk(w,h),g=o.getContext('2d');fn(g);return o;};
 const tail=part(g=>{g.drawImage(img,0,0);g.globalCompositeOperation='destination-in';g.fillRect(0,0,R.tailX+18,h);});
 const fin=rc=>part(g=>{g.drawImage(img,0,0);g.globalCompositeOperation='destination-in';g.fillRect(...rc);g.globalCompositeOperation='destination-out';g.beginPath();g.ellipse(ex,ey,erx-14,ery-14,0,0,7);g.fill();});
 const ft=fin(R.finTop.r),fb=fin(R.finBot.r);
 const body=part(g=>{g.drawImage(img,0,0);g.globalCompositeOperation='destination-out';for(const f of [R.finTop,R.finBot]){g.save();g.beginPath();g.rect(...f.r);g.ellipse(ex,ey,erx,ery,0,0,7);g.clip('evenodd');g.fillRect(...f.r);g.restore();}});
 return {tail,ft,fb,body,w,h};}

 g.save();g.translate(cx,cy);g.scale(face*k,k);const sq=1+Math.sin(t*8*spd+ph)*.015;g.scale(sq,1/sq);g.translate(-P.w/2,-P.h/2);
 rot(P.ft,R.finTop.p[0],R.finTop.p[1],Math.sin(t*5*spd+ph+1)*.08);rot(P.fb,R.finBot.p[0],R.finBot.p[1],Math.sin(t*9*spd+ph)*.12);

 {const B=Math.min(P.w,R.tailX+R.ell[2]*.9),amp=R.ell[3]*.22,ph2=t*7*spd+ph;if(!P.buf){P.buf=mk(P.w,P.h);}const bg=P.buf.getContext('2d');bg.clearRect(0,0,P.w,P.h);for(let sx=0;sx<B;sx+=2){const k=1-sx/B,dy=Math.round(Math.sin(ph2-sx*.012)*amp*k*k);bg.drawImage(P.body,sx,0,2,P.h,sx,dy,2,P.h);}bg.drawImage(P.body,B,0,P.w-B,P.h,B,0,P.w-B,P.h);g.drawImage(P.buf,0,0);}
 const [ex,ey]=R.eye,[mx,my]=R.mouth,[bx,by]=R.blush,blink=((t+ph)%3.6)<.12,fs=R.fs||1;g.translate(ex,ey);g.scale(fs,fs);g.translate(-ex,-ey);
 g.fillStyle='rgba(255,120,150,.45)';g.beginPath();g.ellipse(bx,by,19,11,0,0,7);g.fill();
 g.strokeStyle=INK;g.fillStyle=INK;g.lineCap='round';g.lineWidth=9;
 if(exp==='happy'){g.beginPath();g.arc(ex,ey+8,17,Math.PI*1.15,Math.PI*1.85);g.stroke();}

 if(exp==='sad'){g.lineWidth=6;g.beginPath();g.moveTo(ex-16,ey-24);g.lineTo(ex+10,ey-18);g.stroke();const ty=(t*40)%40;g.fillStyle='rgba(120,200,255,'+(1-ty/40)+')';g.beginPath();g.ellipse(ex-6,ey+20+ty,5,8,0,0,7);g.fill();}

// ── 게임 데이터 ──
const ANIMALS=[{id:'me',name:'방울',lv:1,w:74,speed:4.2,desc:'우리 집 호기심 대장'},{id:'sis',name:'콩이',lv:2,w:58,speed:4.7,desc:'작아서 잘 안 부딪혀요',small:true},{id:'fr',name:'새싹',lv:3,w:92,speed:3.8,desc:'먹이를 끌어당겨요',magnet:true},{id:'mom',name:'엄마',lv:4,w:82,speed:3.9,desc:'배고픔이 천천히 줄어요',thrifty:true},{id:'dad',name:'아빠',lv:5,w:92,speed:3.5,desc:'부딪혀도 덜 아파요',tough:true}];
let save={lv:1,xp:0,pick:'me',days:0};try{Object.assign(save,JSON.parse(localStorage.getItem('pongdang')||'{}'));}catch(e){}
function store(){try{localStorage.setItem('pongdang',JSON.stringify(save));}catch(e){}}
const need=lv=>60+lv*40;
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}addEventListener('resize',rs);rs();
const $=id=>document.getElementById(id);
const pickCv={};
function buildPick(){const p=$('pick');p.innerHTML='';for(const a of ANIMALS){const b=document.createElement('button');const open=save.lv>=a.lv;b.className=(open?'':'lock')+(save.pick===a.id?' sel':'');
  const cv=document.createElement('canvas');cv.width=216;cv.height=160;pickCv[a.id]=cv;b.appendChild(cv);b.insertAdjacentHTML('beforeend',a.name+'<small>'+(open?a.desc:'Lv '+a.lv+'에 열려요')+'</small>');b.title=a.desc;
  if(open)b.onclick=()=>{save.pick=a.id;store();buildPick();};p.appendChild(b);}}
for(const k in SRC){const i=new Image();i.onload=()=>{PARTS[k]=build(i,rigOf(k));nLoaded++;};i.src='data:image/webp;base64,'+SRC[k];}
// ── 상태 ──
const DAY=75;let G=null,cam=0,run=false;
function newDay(){const a=ANIMALS.find(v=>v.id===save.pick);G={a,px:W*0.38,py:H*0.5,vx:0,vy:0,face:1,hunger:1,eaten:0,time:0,food:[],pred:[],hurt:0,joyT:0,ended:false,bubbles:[],t:0};
 for(let i=0;i<14;i++)spawnFood(true);run=true;$('hud').classList.remove('hide');$('tip').classList.remove('hide');$('tip').style.opacity=1;setTimeout(()=>$('tip').style.opacity=0,3500);}
function spawnFood(init){G.food.push({wx:cam+(init?Math.random()*W*1.6:W+40+Math.random()*W*.6),y:H*.15+Math.random()*H*.58,r:5+Math.random()*5,ph:Math.random()*6,kind:Math.random()<.25?'shrimp':'dot'});}
function spawnPred(){const big=Math.random()<.35;G.pred.push({wx:cam+W+120,y:H*.18+Math.random()*H*.55,s:big?1.6:1.1,sp:(big?1.6:2.4)+G.time/DAY*1.5,ph:Math.random()*6});}
const JR=55;let joy=null;const jEl=$('joy'),jK=jEl.querySelector('i');
c.addEventListener('pointerdown',e=>{if(!run)return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};jEl.style.display='block';jEl.style.left=e.clientX+'px';jEl.style.top=e.clientY+'px';jK.style.transform='';try{c.setPointerCapture(e.pointerId);}catch(_){}});
c.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy);if(d>JR){dx*=JR/d;dy*=JR/d;}joy.dx=dx/JR;joy.dy=dy/JR;jK.style.transform='translate('+dx+'px,'+dy+'px)';});
function jEnd(e){if(joy&&(!e||e.pointerId===joy.id)){joy=null;jEl.style.display='none';}}c.addEventListener('pointerup',jEnd);c.addEventListener('pointercancel',jEnd);
const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
function rnd(i){const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s);}
function drawPred(p){x.save();x.translate(p.wx-cam,p.y);x.scale(-p.s,p.s);const w=Math.sin(p.ph)*.25;x.fillStyle='#4a5a8a';x.strokeStyle='#3b2a22';x.lineWidth=5;x.lineJoin='round';
 x.beginPath();x.moveTo(70,0);x.quadraticCurveTo(40,-40,-30,-28);x.quadraticCurveTo(-60,-12,-62,0);x.quadraticCurveTo(-60,14,-30,28);x.quadraticCurveTo(40,40,70,0);x.fill();x.stroke();
 x.save();x.translate(-58,0);x.rotate(w);x.beginPath();x.moveTo(0,0);x.lineTo(-34,-30);x.lineTo(-26,0);x.lineTo(-34,30);x.closePath();x.fill();x.stroke();x.restore();
 x.beginPath();x.moveTo(5,-32);x.lineTo(20,-58);x.lineTo(32,-30);x.fill();x.stroke();
 x.fillStyle='#3b2a22';x.beginPath();x.arc(40,-8,6,0,7);x.fill();x.lineWidth=4;x.beginPath();x.moveTo(28,-20);x.lineTo(50,-14);x.stroke();
 x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(54,12);for(let i=0;i<4;i++)x.lineTo(58-i*7,i%2?10:18);x.stroke();x.restore();}
function hills(off,y,amp,col,seed,step){x.fillStyle=col;x.beginPath();x.moveTo(0,H);const o=((off%step)+step)%step,base=Math.floor(off/step);for(let i=-1;i<=W/step+2;i++)x.lineTo(i*step-o,y-rnd(base+i+seed)*amp);x.lineTo(W,H);x.fill();}
function weeds(off,y,col,seed,h0,gap,sw,t){const o=((off%gap)+gap)%gap,base=Math.floor(off/gap);x.strokeStyle=col;x.lineCap='round';x.lineWidth=sw;for(let i=-1;i<=W/gap+2;i++){const k=base+i;if(rnd(k+seed)<.3)continue;const bx=i*gap-o+rnd(k*3+seed)*gap*.6,h=h0*(.55+rnd(k*7+seed)*.6);x.beginPath();x.moveTo(bx,y);for(let j=1;j<=7;j++)x.lineTo(bx+Math.sin(t*1.5+j*.8+k)*j*2.4,y-h*j/7);x.stroke();}}
function coral(off,y,seed,gap){const o=((off%gap)+gap)%gap,base=Math.floor(off/gap),cols=['#ff9fbf','#ffc27a','#c7a8ff','#ff8f8f'];for(let i=-1;i<=W/gap+2;i++){const k=base+i;if(rnd(k+seed)<.45)continue;const bx=i*gap-o+rnd(k*5)*gap*.5;x.fillStyle=cols[Math.floor(rnd(k*9)*4)];x.strokeStyle='#3b2a22';x.lineWidth=3.5;for(let b=0;b<3;b++){x.beginPath();x.ellipse(bx+(b-1)*14,y-18-rnd(k+b)*26,9,22+rnd(k*2+b)*14,(b-1)*.35,0,7);x.fill();x.stroke();}}}
function layer(img,off,h,y,alpha=1){if(!img.complete||!img.naturalWidth)return;const w=img.naturalWidth*h/img.naturalHeight;let o=((off%w)+w)%w;x.save();x.globalAlpha=alpha;for(let X=-o;X<W;X+=w)x.drawImage(img,X,y,w+1,h);x.restore();}
function tintAt(f){const S=[[0,[255,170,120,.22]],[.22,[255,255,255,0]],[.62,[255,255,255,0]],[.82,[255,130,70,.22]],[1,[10,20,70,.5]]];let i=0;while(i<S.length-2&&f>S[i+1][0])i++;const A=S[i],B=S[i+1],k=Math.min(1,Math.max(0,(f-A[0])/(B[0]-A[0])));return A[1].map((v,j)=>v+(B[1][j]-v)*k);}
function skyAt(f){const S=[[0,[255,200,170],[90,160,210]],[.22,[170,230,255],[70,165,220]],[.6,[150,220,255],[55,150,210]],[.82,[255,175,130],[95,100,170]],[1,[70,85,150],[20,40,90]]];let i=0;while(i<S.length-2&&f>S[i+1][0])i++;const A=S[i],B=S[i+1],k=Math.min(1,Math.max(0,(f-A[0])/(B[0]-A[0])));const m=(p,q)=>p.map((v,j)=>Math.round(v+(q[j]-v)*k));return [m(A[1],B[1]),m(A[2],B[2])];}
function label(f){return f<.18?'🌅 새벽':f<.45?'☀️ 아침':f<.7?'🌤 낮':f<.88?'🌇 저녁':'🌙 밤';}
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;x.clearRect(0,0,W,H);
 const f=G&&run?Math.min(1,G.time/DAY):.3;
 cam+=(run&&G&&!G.ended?(1.1+G.a.speed*.15)*60:30)*dt;
 // 먼 바다(그림) — 화면 높이에 맞춰 천천히
 x.fillStyle='#2f7fd6';x.fillRect(0,0,W,H);layer(BGI.far,cam*.05,H,0);
 // 바위·산호(그림)
 const mh=Math.min(H*.25,W*.42);layer(BGI.mid,cam*.45,mh,H-mh);
 if(run&&G)drawMarks();
 if(run&&G)step(dt);else drawFamily();
 // 해초(그림) — 맨 앞, 살짝 흔들림
 const fh=Math.min(H*.2,W*.34);layer(BGI.front,cam*1.3+Math.sin(T*.8)*6,fh,H-fh*.85,.95);
 const tn=tintAt(run?f:.4);if(tn[3]>0){x.fillStyle='rgba('+tn[0]+','+tn[1]+','+tn[2]+','+tn[3]+')';x.fillRect(0,0,W,H);}
 for(const id in pickCv){const cv=pickCv[id],g=cv.getContext('2d');g.clearRect(0,0,216,160);drawRig(g,id,108,82,id==='fr'?190:150,1,T,save.pick===id?'happy':'normal',false,1,id.length);}
 requestAnimationFrame(loop);}
// 시작 화면: 가족이 헤엄치는 배경
function mark(img,wx,lbl){if(!img.complete||!img.naturalWidth)return;const hh=Math.min(H*.5,W*.36),hw=hh*img.naturalWidth/img.naturalHeight,sx=wx-cam*.45;if(sx>W+20||sx+hw<-20)return;x.drawImage(img,sx,H-hh-H*.03,hw,hh);
 if(lbl){x.font='800 14px system-ui';x.textAlign='center';x.fillStyle='rgba(0,0,0,.35)';const tw=x.measureText(lbl).width+18;x.fillRect(sx+hw/2-tw/2,H-hh-H*.03-26,tw,22);x.fillStyle='#fff';x.fillText(lbl,sx+hw/2,H-hh-H*.03-10);x.textAlign='left';}}
function drawMarks(){const P=G;if(P.houseWX==null)P.houseWX=cam*.45+W*.02;mark(BGI.house,P.houseWX,P.time<6?'우리 집':'');
 if(P.time>=DAY*.38&&P.schoolWX==null)P.schoolWX=cam*.45+W+20;if(P.schoolWX!=null)mark(BGI.school,P.schoolWX,'물고기 학교');
 if(P.time>=DAY*.86&&P.home2==null)P.home2=cam*.45+W+20;if(P.home2!=null)mark(BGI.house,P.home2,'우리 집');}
function drawFamily(){const ki=(H>W*1.1)?BGI.keyV:BGI.keyH;if(ki.complete&&ki.naturalWidth){const sc=Math.max(W/ki.naturalWidth,H/ki.naturalHeight),dw=ki.naturalWidth*sc,dh=ki.naturalHeight*sc;x.drawImage(ki,(W-dw)/2,(H-dh)/2+Math.sin(T*.5)*3,dw,dh);return;}const s=Math.min(W,H)/700;const hi=BGI.house;if(hi.complete&&hi.naturalWidth){const hh=Math.min(H*.62,W*.42),hw=hh*hi.naturalWidth/hi.naturalHeight;x.drawImage(hi,W*.02,H-hh-H*.04,hw,hh);}const fam=[['dad',.38,.5,150],['mom',.55,.6,135],['me',.72,.66,115],['sis',.84,.5,85],['fr',.92,.74,150]];
 for(const [id,fx,fy,w] of fam)drawRig(x,id,W*fx+Math.sin(T*.6+fx*9)*20,H*fy+Math.sin(T*1.4+fx*7)*10,w*s,1,T,'normal',false,1,fx*10);}
function step(dt){const P=G;if(P.ended)return;P.time+=dt;P.t+=dt;const a=P.a,size=a.w*(Math.min(W,H)<600?.85:1);
 let ix=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),iy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(ix&&iy){ix*=.707;iy*=.707;}if(joy){ix=joy.dx;iy=joy.dy;}
 const sp=a.speed*60;P.vx+=(ix*sp-P.vx)*Math.min(1,dt*5);P.vy+=(iy*sp-P.vy)*Math.min(1,dt*5);
 P.px=Math.max(size*.6,Math.min(W-size*.6,P.px+P.vx*dt));P.py=Math.max(60,Math.min(H*.8,P.py+P.vy*dt));if(Math.abs(P.vx)>8)P.face=P.vx>0?1:-1;
 P.hunger-=dt*(a.thrifty?.016:.022);if(P.hurt>0)P.hurt-=dt;P.joyT=Math.max(0,P.joyT-dt);
 if(Math.random()<dt*1.6)spawnFood();
 for(const fd of P.food){let sx=fd.wx-cam,sy=fd.y+Math.sin(T*2+fd.ph)*6;
  if(a.magnet){const dd=Math.hypot(sx-P.px,sy-P.py);if(dd<170){fd.wx+=(P.px-sx)*dt*2.2;fd.y+=(P.py-sy)*dt*2.2;}}
  if(fd.kind==='dot'){x.fillStyle='#fff6b0';x.strokeStyle='#3b2a22';x.lineWidth=2.5;x.beginPath();x.arc(sx,sy,fd.r,0,7);x.fill();x.stroke();}
  else{x.strokeStyle='#ff8f70';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(sx,sy,9,.4,3.6);x.stroke();}
  if(Math.hypot(sx-P.px,sy-P.py)<size*.45+fd.r){fd.gone=1;P.joyT=.6;P.eaten+=fd.kind==='dot'?1:2;P.hunger=Math.min(1,P.hunger+(fd.kind==='dot'?.07:.13));for(let i=0;i<4;i++)P.bubbles.push({x:sx,y:sy,vy:-30-Math.random()*40,r:2+Math.random()*3,l:1});}
  if(sx<-60)fd.gone=1;}
 P.food=P.food.filter(v=>!v.gone);
 if(Math.random()<dt*(.08+P.time/DAY*.35))spawnPred();
 for(const p of P.pred){p.ph+=dt*6;const sx=p.wx-cam;if(sx>P.px-40&&sx<P.px+420)p.y+=Math.sign(P.py-p.y)*Math.min(Math.abs(P.py-p.y),70*dt);p.wx-=p.sp*60*dt;drawPred(p);
  if(!P.hurt&&Math.hypot(sx-P.px,p.y-P.py)<(size*(a.small?.3:.4)+44*p.s)){P.hurt=1.2;P.hunger-=a.tough?.16:.28;P.vx-=260;}if(sx<-200)p.gone=1;}
 P.pred=P.pred.filter(v=>!v.gone);
 const exp=P.hurt>0?'surprise':P.joyT>0?'happy':P.hunger<.25?'sad':'normal';
 x.save();if(P.hurt>0&&Math.floor(P.hurt*10)%2)x.globalAlpha=.4;drawRig(x,a.id,P.px,P.py,size*1.6,P.face,P.t,exp,false,1+Math.hypot(P.vx,P.vy)/300,0);x.restore();
 for(const b of P.bubbles){b.y+=b.vy*dt;b.l-=dt*1.2;x.strokeStyle='rgba(255,255,255,'+Math.max(0,b.l)+')';x.lineWidth=2;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke();}P.bubbles=P.bubbles.filter(b=>b.l>0);
 $('hunger').style.width=Math.max(0,P.hunger*100)+'%';$('hunger').style.background=P.hunger<.3?'#ff6b6b':'#ffd34d';$('clock').textContent=label(P.time/DAY);$('lv').textContent='Lv '+save.lv;
 if(P.hunger<=0)finish(false);else if(P.time>=DAY)finish(true);}
function finish(ok){const P=G;P.ended=true;run=false;jEnd();$('hud').classList.add('hide');$('tip').classList.add('hide');
 const gain=Math.round(P.eaten*3+(ok?40:Math.floor(P.time/DAY*20)));save.days++;const before=save.lv;save.xp+=gain;while(save.xp>=need(save.lv)){save.xp-=need(save.lv);save.lv++;}store();
 $('endT').textContent=ok?'하루를 살아냈어요! 🌙':'배가 너무 고파요… 😵';$('endP').innerHTML=(ok?'밤까지 무사히 버텼어요. 집에 가서 푹 쉬어요.':'오늘은 '+label(P.time/DAY).slice(2)+'까지 버텼어요.')+'<br>먹이 '+P.eaten+'개 · 경험치 +'+gain;
 const nu=ANIMALS.filter(v=>v.lv>before&&v.lv<=save.lv).map(v=>v.name);$('endLv').innerHTML='Lv '+save.lv+(save.lv>before?' 🎉 레벨 업!':'')+(nu.length?'<br><b>새 친구 해금: '+nu.join(', ')+'</b>':'');
 $('end').classList.remove('hide');$('xpb').style.width='0';setTimeout(()=>$('xpb').style.width=(save.xp/need(save.lv)*100)+'%',60);}
$('goBtn').onclick=()=>{$('start').classList.add('hide');newDay();};
$('againBtn').onclick=()=>{$('end').classList.add('hide');G=null;buildPick();$('start').classList.remove('hide');};
buildPick();requestAnimationFrame(loop);
