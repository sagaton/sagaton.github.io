function drawBoss(b){const x0=Math.round(b.x-cam.x),y0=Math.round(b.y-cam.y),r=14;
 for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=Math.hypot(x,y);if(d>r)continue;let col=d>r-1.5?'#0b0a0c':(d>r-4?'#5a1a28':'#d8c8c0');
  const ex=b.lookX*5,ey=b.lookY*5,dd=Math.hypot(x-ex,y-ey);if(d<=r-4){if(dd<6)col=b.hurt>0?'#fff':'#a01820';if(dd<3)col='#0b0a0c';if(dd<1.2&&x-ex<0&&y-ey<0)col='#fff';}
  if(d<=r-4&&d>r-6&&((x*7+y*3)%9===0))col='#a01820';g.fillStyle=col;g.fillRect(x0+x,y0+y,1,1);}
 for(let i=0;i<6;i++){const a=i/6*Math.PI*2+T*.6,len=6+Math.sin(T*3+i)*3;for(let k=0;k<len;k++){g.fillStyle=k%2?'#2a2430':'#5a1a28';g.fillRect(Math.round(x0+Math.cos(a)*(r+k)),Math.round(y0+Math.sin(a)*(r+k)),1,1);}}}
