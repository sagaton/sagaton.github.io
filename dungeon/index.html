function tile(tx,ty){if(ty<0||ty>=MH||tx<0||tx>=MW)return '#';return map[ty][tx];}
function solid(px,py){const ch=tile(Math.floor(px/TS),Math.floor(py/TS));return ch==='#'||(ch==='+'&&!stairsOpen&&false);}

 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const ch=map[y][x],cx=x*TS+TS/2,cy=y*TS+TS/2;
  if(ch==='P'){P={x:cx,y:cy,vx:0,vy:0,hp:P?P.hp:6,max:6,face:1,dir:{x:1,y:0},atk:0,atkCd:0,inv:0,roll:0,rollCd:0,walk:0};}

 if(boss){hasKey=true;}

 const cand=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){if(map[y][x]!=='.')continue;const wl=(map[y-1][x]==='#')+(map[y+1][x]==='#')+(map[y][x-1]==='#')+(map[y][x+1]==='#');const cx=x*TS+TS/2,cy=y*TS+TS/2;if(wl>=2&&Math.hypot(cx-P.x,cy-P.y)>80&&!items.some(it=>Math.hypot(it.x-cx,it.y-cy)<40))cand.push({cx,cy,wl,r:Math.sin(x*12.9+y*78.2+i*3)*43758%1});}

 say(S.name,2.6);}
function mk(type,x,y){const base={slime:{hp:3,sp:18,r:4,dmg:1,sense:70},skel:{hp:5,sp:26,r:4,dmg:1,sense:90},bat:{hp:2,sp:46,r:3,dmg:1,sense:110}}[type];return Object.assign({type,x,y,vx:0,vy:0,hurt:0,cd:0,ph:Math.random()*6,face:1,awake:false},base);}
